<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Area Boyz Enterprise – Styles that fit your life. An evolutionary platform for swag, tranquility and handmade crafty designer outfits with intention. Total equity \~$758,000.">
  <meta name="theme-color" content="#FFD100">
  <title>Area Boyz Enterprise | Styles That Fit Your Life</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- App Shell -->
  <div id="app" class="app">
    <!-- Top Status / Browser Bar Simulation -->
    <header class="top-bar">
      <div class="status-row">
        <span class="time">9:24</span>
        <div class="status-icons">
          <span class="signal"></span>
          <span class="wifi"></span>
          <span class="battery">95</span>
        </div>
      </div>
      <div class="url-bar">
        <span class="lock">🔒</span>
        <span class="url">areaboyz.com</span>
        <button class="add-tab" aria-label="New tab">+</button>
      </div>
    </header>

    <!-- Main Navigation Header -->
    <header class="site-header">
      <div class="header-row">
        <button class="menu-btn" id="menuToggle" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <a href="#home" class="brand" data-page="home">
          <span class="brand-icon">AB</span>
          <span class="brand-name">Area Boyz</span>
        </a>
        <div class="header-actions">
          <button class="search-toggle" id="searchToggle" aria-label="Search">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
          <a href="#cart" class="cart-btn" data-page="cart" aria-label="Cart">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M6 6L5 3H2"/></svg>
            <span class="cart-count" id="cartCount">0</span>
          </a>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="search-bar" id="searchBar">
        <input type="search" id="searchInput" placeholder="Search designer wears, outfits..." autocomplete="off">
        <button class="search-go" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
      </div>

      <!-- Location + Language -->
      <div class="location-row">
        <div class="location">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
          <span>Lagos, NG • Worldwide</span>
        </div>
        <div class="lang-pill">EN / PIDGIN</div>
      </div>

      <!-- Category Pills -->
      <nav class="category-pills" aria-label="Categories">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="denim">Denim</button>
        <button class="pill" data-filter="street">Street</button>
        <button class="pill" data-filter="handmade">Handmade</button>
        <button class="pill" data-filter="luxury">Luxury</button>
        <button class="pill" data-filter="new">New Drops</button>
      </nav>
    </header>

    <!-- Main Content Area -->
    <main id="mainContent" class="main-content" role="main">
      <!-- Pages will be injected here by JS -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Primary">
      <a href="#home" class="nav-item active" data-page="home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
        <span>Home</span>
      </a>
      <a href="#shop" class="nav-item" data-page="shop">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span>Shop</span>
      </a>
      <a href="#invest" class="nav-item" data-page="invest">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        <span>Invest</span>
      </a>
      <a href="#about" class="nav-item" data-page="about">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>About</span>
      </a>
      <a href="#account" class="nav-item" data-page="account">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Account</span>
      </a>
    </nav>
  </div>

  <!-- Side Menu Overlay -->
  <div id="sideMenu" class="side-menu" aria-hidden="true">
    <div class="side-menu-header">
      <span class="brand-icon">AB</span>
      <button id="closeMenu" aria-label="Close menu">✕</button>
    </div>
    <nav class="side-nav">
      <a href="#home" data-page="home">Home</a>
      <a href="#shop" data-page="shop">Shop All Designer Wears</a>
      <a href="#collections" data-page="collections">Collections</a>
      <a href="#invest" data-page="invest">Investment & Equity</a>
      <a href="#about" data-page="about">Our Story</a>
      <a href="#contact" data-page="contact">Contact</a>
    </nav>
    <div class="side-footer">
      <p>Total Equity</p>
      <strong>\~$758,000</strong>
    </div>
  </div>
  <div id="overlay" class="overlay"></div>

  <script src="./js/app.js"></script>
</body>
</html>
