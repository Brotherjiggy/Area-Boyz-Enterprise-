<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Area Boyz Enterprise</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">
        <div class="logo-icon">AB</div>
        <span>Area Boyz</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="shares.html">Invest</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="cart-btn" aria-label="Shopping cart">
          🛒
          <span class="cart-count">0</span>
        </a>
        <button class="mobile-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Checkout</h1>
        <p style="color:var(--text-secondary)">Secure payment powered by modern encryption standards.</p>
      </div>
    </section>

    <section class="section" style="padding-top:1rem">
      <div class="container">
        <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:2.5rem;align-items:start">
          
          <!-- Checkout Form -->
          <form id="checkout-form" class="invest-form">
            <h3 style="margin-bottom:1.5rem">Shipping & Payment</h3>
            
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem">
              <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" class="form-control" required>
              </div>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" class="form-control" required>
            </div>

            <div class="form-group">
              <label for="address">Shipping Address</label>
              <input type="text" id="address" class="form-control" required>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem">
              <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="state">State / Region</label>
                <input type="text" id="state" class="form-control">
              </div>
              <div class="form-group">
                <label for="zip">Postal Code</label>
                <input type="text" id="zip" class="form-control" required>
              </div>
            </div>

            <hr style="border:none;border-top:1px solid var(--border);margin:1.5rem 0">

            <div class="form-group">
              <label for="card">Card Number</label>
              <input type="text" id="card" class="form-control" placeholder="ACCT-000015" required>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
              <div class="form-group">
                <label for="expiry">Expiry</label>
                <input type="text" id="expiry" class="form-control" placeholder="MM/YY" required>
              </div>
              <div class="form-group">
                <label for="cvc">CVC</label>
                <input type="text" id="cvc" class="form-control" placeholder="123" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1rem">Pay Securely</button>
          </form>

          <!-- Order Summary -->
          <div class="checkout-summary">
            <h3 style="margin-bottom:1.25rem">Order Total</h3>
            <div style="display:flex;justify-content:space-between;font-size:1.5rem;font-weight:700;margin-bottom:1rem">
              <span>Total</span>
              <span id="checkout-total" style="color:var(--accent)">$0</span>
            </div>
            <p style="font-size:0.85rem;color:var(--text-secondary)">
              This is a demo checkout. No real payment will be processed.
            </p>
            <a href="cart.html" style="display:inline-block;margin-top:1rem;color:var(--accent);font-size:0.9rem">← Back to Cart</a>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding-top:0">
        <span>© 2026 Area Boyz Enterprise</span>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
